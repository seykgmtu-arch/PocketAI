 # ============================================================
      # 11. Создание облегчённого PATCH
      #
      # В PATCH попадают:
      #
      #   PocketAI.exe
      #   *.dll
      #   *.deps.json
      #   *.runtimeconfig.json
      #   runtimes\
      #
      # В том числе:
      #
      #   PocketAI.Images.dll
      #   Microsoft.Web.WebView2.Core.dll
      #   Microsoft.Web.WebView2.Wpf.dll
      #   runtimes\win-x64\native\WebView2Loader.dll
      #
      # НЕ попадают:
      #
      #   pocketai.json
      #   models\
      #   runtime\
      #   knowledge\
      #   outputs\
      #   logs\
      #   diagnostics\
      #   webview2\
      #
      # Таким образом сохраняются:
      #
      #   пользовательские настройки
      #   llama.cpp
      #   sd-server.exe
      #   локальные модели
      #   база знаний
      #   изображения
      #   профиль Perchance/WebView2
      #
      # ============================================================

      - name: Create lightweight patch archive
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          $source = ".\dist\PocketAI"
          $patchDir = ".\dist\PocketAI-patch"
          $patchZip = ".\dist\PocketAI-win-x64-patch.zip"

          Write-Host ""
          Write-Host "======================================="
          Write-Host " Creating lightweight PocketAI patch"
          Write-Host "======================================="
          Write-Host ""

          # ========================================================
          # Очистка старого PATCH
          # ========================================================

          Remove-Item `
            $patchDir `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $patchZip `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $patchDir `
            -Force | Out-Null

          # ========================================================
          # Проверка publish-каталога
          # ========================================================

          if (-not (Test-Path $source)) {

            throw "Publish directory not found: $source"

          }

          Write-Host "Publish directory:"
          Write-Host (Resolve-Path $source)
          Write-Host ""

          # ========================================================
          # PocketAI.exe
          # ========================================================

          $exe = Join-Path $source "PocketAI.exe"

          if (-not (Test-Path $exe)) {

            throw "PocketAI.exe was not found in $source"

          }

          Copy-Item `
            $exe `
            $patchDir `
            -Force

          Write-Host "Copied PocketAI.exe"

          # ========================================================
          # Все DLL из корня publish
          #
          # Сюда попадут:
          #
          # PocketAI.dll
          # PocketAI.Core.dll
          # PocketAI.Hardware.dll
          # PocketAI.Inference.dll
          # PocketAI.Knowledge.dll
          # PocketAI.Web.dll
          # PocketAI.Images.dll
          #
          # Microsoft.Web.WebView2.Core.dll
          # Microsoft.Web.WebView2.Wpf.dll
          #
          # и другие необходимые managed DLL.
          # ========================================================

          Get-ChildItem `
            -Path $source `
            -Filter "*.dll" `
            -File |
          ForEach-Object {

            Copy-Item `
              $_.FullName `
              $patchDir `
              -Force

          }

          Write-Host "Root DLL files copied."

          # ========================================================
          # *.deps.json
          # ========================================================

          Get-ChildItem `
            -Path $source `
            -Filter "*.deps.json" `
            -File |
          ForEach-Object {

            Copy-Item `
              $_.FullName `
              $patchDir `
              -Force

          }

          Write-Host "*.deps.json copied."

          # ========================================================
          # *.runtimeconfig.json
          # ========================================================

          Get-ChildItem `
            -Path $source `
            -Filter "*.runtimeconfig.json" `
            -File |
          ForEach-Object {

            Copy-Item `
              $_.FullName `
              $patchDir `
              -Force

          }

          Write-Host "*.runtimeconfig.json copied."

          # ========================================================
          # Native runtimes NuGet/.NET
          #
          # ВАЖНО:
          #
          # runtimes\
          #
          # НЕ является пользовательским каталогом:
          #
          # runtime\
          #
          # runtimes\ содержит native-компоненты NuGet.
          #
          # Для WebView2 здесь находится:
          #
          # runtimes\win-x64\native\WebView2Loader.dll
          #
          # runtime\llama\
          # runtime\image\
          #
          # в PATCH НЕ включаются.
          # ========================================================

          $nativeRuntimes = Join-Path $source "runtimes"

          if (Test-Path $nativeRuntimes) {

            Copy-Item `
              $nativeRuntimes `
              (Join-Path $patchDir "runtimes") `
              -Recurse `
              -Force

            Write-Host "Native runtimes copied."

          }
          else {

            Write-Host "WARNING: publish does not contain runtimes directory."

          }

          # ========================================================
          # Проверка обязательных файлов PATCH
          # ========================================================

          $requiredFiles = @(

            "PocketAI.exe",

            "PocketAI.dll",

            "PocketAI.Core.dll",

            "PocketAI.Hardware.dll",

            "PocketAI.Inference.dll",

            "PocketAI.Knowledge.dll",

            "PocketAI.Web.dll",

            "PocketAI.Images.dll",

            "Microsoft.Web.WebView2.Core.dll",

            "Microsoft.Web.WebView2.Wpf.dll",

            "PocketAI.deps.json",

            "PocketAI.runtimeconfig.json"

          )

          Write-Host ""
          Write-Host "======================================="
          Write-Host " VERIFY REQUIRED PATCH FILES"
          Write-Host "======================================="
          Write-Host ""

          foreach ($file in $requiredFiles) {

            $path = Join-Path $patchDir $file

            if (-not (Test-Path $path)) {

              throw "Required patch file missing: $file"

            }

            $info = Get-Item $path

            Write-Host (
              "{0} | {1} bytes | {2}" -f `
              $file, `
              $info.Length, `
              $info.LastWriteTimeUtc
            )

          }

          # ========================================================
          # Проверка WebView2 native loader
          # ========================================================

          Write-Host ""
          Write-Host "======================================="
          Write-Host " VERIFY WEBVIEW2 NATIVE RUNTIME"
          Write-Host "======================================="
          Write-Host ""

          $webView2LoaderCandidates = @(

            (Join-Path `
              $patchDir `
              "runtimes\win-x64\native\WebView2Loader.dll"),

            (Join-Path `
              $patchDir `
              "runtimes\win-arm64\native\WebView2Loader.dll"),

            (Join-Path `
              $patchDir `
              "runtimes\win-x86\native\WebView2Loader.dll")

          )

          $webView2Loader = $null

          foreach ($candidate in $webView2LoaderCandidates) {

            if (Test-Path $candidate) {

              $webView2Loader = $candidate
              break

            }

          }

          if ($null -eq $webView2Loader) {

            throw "WebView2Loader.dll is missing from PATCH runtimes."

          }

          $loaderInfo = Get-Item $webView2Loader

          Write-Host (
            "WebView2Loader.dll | {0} bytes | {1}" -f `
            $loaderInfo.Length, `
            $loaderInfo.FullName
          )

          # ========================================================
          # Проверка того, что пользовательские данные НЕ попали
          # в облегчённый PATCH
          # ========================================================

          $forbidden = @(

            "pocketai.json",

            "models",

            "runtime",

            "knowledge",

            "outputs",

            "logs",

            "diagnostics",

            "webview2"

          )

          Write-Host ""
          Write-Host "======================================="
          Write-Host " VERIFY EXCLUDED FILES AND DIRECTORIES"
          Write-Host "======================================="
          Write-Host ""

          foreach ($item in $forbidden) {

            $forbiddenPath = Join-Path $patchDir $item

            if (Test-Path $forbiddenPath) {

              throw "Forbidden item found in patch: $item"

            }

            Write-Host "Excluded correctly: $item"

          }

          # ========================================================
          # Вывод полного состава PATCH
          # ========================================================

          Write-Host ""
          Write-Host "======================================="
          Write-Host " PATCH CONTENTS"
          Write-Host "======================================="
          Write-Host ""

          $patchFiles = Get-ChildItem `
            $patchDir `
            -Recurse `
            -File |
          Sort-Object FullName

          foreach ($file in $patchFiles) {

            $relative = $file.FullName.Substring(
              $patchDir.Length
            ).TrimStart('\')

            Write-Host (
              "{0} | {1} bytes" -f `
              $relative, `
              $file.Length
            )

          }

          # ========================================================
          # Статистика PATCH
          # ========================================================

          $patchFileCount = (
            Get-ChildItem `
              $patchDir `
              -Recurse `
              -File
          ).Count

          $patchTotalSize = (
            Get-ChildItem `
              $patchDir `
              -Recurse `
              -File |
            Measure-Object `
              -Property Length `
              -Sum
          ).Sum

          Write-Host ""
          Write-Host "======================================="
          Write-Host " PATCH STATISTICS"
          Write-Host "======================================="
          Write-Host ""

          Write-Host "Files:"
          Write-Host $patchFileCount

          Write-Host ""

          Write-Host "Uncompressed size:"
          Write-Host "$patchTotalSize bytes"

          # ========================================================
          # Создание ZIP
          # ========================================================

          Write-Host ""
          Write-Host "======================================="
          Write-Host " CREATING PATCH ZIP"
          Write-Host "======================================="
          Write-Host ""

          Compress-Archive `
            -Path "$patchDir\*" `
            -DestinationPath $patchZip `
            -CompressionLevel Optimal `
            -Force

          if (-not (Test-Path $patchZip)) {

            throw "Patch ZIP was not created."

          }

          $zipInfo = Get-Item $patchZip

          if ($zipInfo.Length -lt 1024) {

            throw "Patch ZIP is unexpectedly small: $($zipInfo.Length) bytes"

          }

          # ========================================================
          # Финальная информация
          # ========================================================

          Write-Host ""
          Write-Host "======================================="
          Write-Host " PATCH READY"
          Write-Host "======================================="
          Write-Host ""

          Write-Host "File:"
          Write-Host $zipInfo.FullName

          Write-Host ""

          Write-Host "ZIP size:"
          Write-Host "$($zipInfo.Length) bytes"

          Write-Host ""

          Write-Host "Files:"
          Write-Host $patchFileCount

          Write-Host ""

          Write-Host "Included:"
          Write-Host "  PocketAI application binaries"
          Write-Host "  PocketAI.Images"
          Write-Host "  WebView2 managed assemblies"
          Write-Host "  WebView2Loader native runtime"

          Write-Host ""

          Write-Host "Preserved on user computer:"
          Write-Host "  pocketai.json"
          Write-Host "  models"
          Write-Host "  runtime\llama"
          Write-Host "  runtime\image"
          Write-Host "  knowledge"
          Write-Host "  outputs"
          Write-Host "  logs"
          Write-Host "  diagnostics"
          Write-Host "  webview2\perchance-profile"

          Write-Host ""
          Write-Host "Lightweight PocketAI patch successfully created."
          Write-Host ""


      # ============================================================
      # 12. Загрузка облегчённого PATCH
      # ============================================================

      - name: Upload lightweight PocketAI patch
        uses: actions/upload-artifact@v6
        with:

          name: PocketAI-win-x64-patch

          path: dist/PocketAI-win-x64-patch.zip

          if-no-files-found: error

          retention-days: 14
