name: Build and smoke-test Pocket AI Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\PocketAI.sln

      - name: Build
        shell: pwsh
        run: |
          dotnet build .\PocketAI.sln `
            -c Release `
            --no-restore

      - name: Cache downloaded AI assets
        uses: actions/cache@v5
        with:
          path: .cache/downloads
          key: pocketai-assets-b10941-qwen3-0.6b-q8

      - name: Fetch verified llama.cpp runtimes and GGUF model
        shell: pwsh
        run: |
          .\scripts\fetch-assets.ps1

      - name: Verify portable layout
        shell: pwsh
        run: |
          .\scripts\verify-layout.ps1 -Strict

      - name: Smoke-test llama.cpp CPU runtime
        shell: pwsh
        run: |
          .\scripts\smoke-test-runtime.ps1

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          .\scripts\publish-win-x64.ps1

      - name: Smoke-test actual PocketAI.exe
        shell: pwsh
        run: |
          .\scripts\smoke-test-pocketai.ps1

      # ============================================================
      # LIGHTWEIGHT PATCH
      # ============================================================

      - name: Create lightweight patch archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source   = ".\dist\PocketAI"
          $patchDir = ".\dist\PocketAI-patch"
          $patchZip = ".\dist\PocketAI-win-x64-patch.zip"

          Write-Host ""
          Write-Host "======================================="
          Write-Host " Creating lightweight PocketAI patch"
          Write-Host "======================================="
          Write-Host ""

          Remove-Item `
            $patchDir `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $patchZip `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $patchDir `
            -Force | Out-Null

          if (-not (Test-Path $source)) {
            throw "Publish directory not found: $source"
          }

          # --------------------------------------------------------
          # PocketAI.exe
          # --------------------------------------------------------

          $exe = Join-Path $source "PocketAI.exe"

          if (-not (Test-Path $exe)) {
            throw "PocketAI.exe was not found in $source"
          }

          Copy-Item `
            $exe `
            $patchDir `
            -Force

          # --------------------------------------------------------
          # Managed DLL
          # --------------------------------------------------------

          Get-ChildItem `
            -Path $source `
            -Filter "*.dll" `
            -File |
          ForEach-Object {
            Copy-Item `
              $_.FullName `
              $patchDir `
              -Force
          }

          # --------------------------------------------------------
          # deps.json
          # --------------------------------------------------------

          Get-ChildItem `
            -Path $source `
            -Filter "*.deps.json" `
            -File |
          ForEach-Object {
            Copy-Item `
              $_.FullName `
              $patchDir `
              -Force
          }

          # --------------------------------------------------------
          # runtimeconfig.json
          # --------------------------------------------------------

          Get-ChildItem `
            -Path $source `
            -Filter "*.runtimeconfig.json" `
            -File |
          ForEach-Object {
            Copy-Item `
              $_.FullName `
              $patchDir `
              -Force
          }

          # --------------------------------------------------------
          # Native NuGet runtimes
          #
          # runtimes\ != runtime\
          #
          # Здесь находится WebView2Loader.dll.
          # runtime\llama и runtime\image сюда НЕ попадают.
          # --------------------------------------------------------

          $nativeRuntimes = Join-Path $source "runtimes"

          if (Test-Path $nativeRuntimes) {
            Copy-Item `
              $nativeRuntimes `
              (Join-Path $patchDir "runtimes") `
              -Recurse `
              -Force
          }

          # --------------------------------------------------------
          # Required managed files
          # --------------------------------------------------------

          $requiredFiles = @(
            "PocketAI.exe",
            "PocketAI.dll",
            "PocketAI.Core.dll",
            "PocketAI.Hardware.dll",
            "PocketAI.Inference.dll",
            "PocketAI.Knowledge.dll",
            "PocketAI.Web.dll",
            "PocketAI.Images.dll",
            "Microsoft.Web.WebView2.Core.dll",
            "Microsoft.Web.WebView2.Wpf.dll",
            "PocketAI.deps.json",
            "PocketAI.runtimeconfig.json"
          )

          Write-Host ""
          Write-Host "======================================="
          Write-Host " VERIFY REQUIRED PATCH FILES"
          Write-Host "======================================="

          foreach ($file in $requiredFiles) {
            $path = Join-Path $patchDir $file

            if (-not (Test-Path $path)) {
              throw "Required patch file missing: $file"
            }

            $info = Get-Item $path

            Write-Host (
              "{0} | {1} bytes" -f `
              $file, `
              $info.Length
            )
          }

          # --------------------------------------------------------
          # WebView2Loader.dll
          # --------------------------------------------------------

          $webView2Loader = Join-Path `
            $patchDir `
            "runtimes\win-x64\native\WebView2Loader.dll"

          if (-not (Test-Path $webView2Loader)) {
            throw "WebView2Loader.dll missing: $webView2Loader"
          }

          Write-Host ""
          Write-Host "WebView2Loader.dll: OK"

          # --------------------------------------------------------
          # User data must NOT be present in lightweight patch
          # --------------------------------------------------------

          $forbidden = @(
            "pocketai.json",
            "models",
            "runtime",
            "knowledge",
            "outputs",
            "logs",
            "diagnostics",
            "webview2"
          )

          Write-Host ""
          Write-Host "======================================="
          Write-Host " VERIFY EXCLUDED USER DATA"
          Write-Host "======================================="

          foreach ($item in $forbidden) {
            $forbiddenPath = Join-Path $patchDir $item

            if (Test-Path $forbiddenPath) {
              throw "Forbidden item found in patch: $item"
            }

            Write-Host "Excluded correctly: $item"
          }

          # --------------------------------------------------------
          # Patch contents
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "======================================="
          Write-Host " PATCH CONTENTS"
          Write-Host "======================================="

          Get-ChildItem `
            $patchDir `
            -Recurse `
            -File |
          Sort-Object FullName |
          ForEach-Object {
            $relative = $_.FullName.Substring(
              $patchDir.Length
            ).TrimStart('\')

            Write-Host (
              "{0} | {1} bytes" -f `
              $relative, `
              $_.Length
            )
          }

          # --------------------------------------------------------
          # ZIP
          # --------------------------------------------------------

          Compress-Archive `
            -Path "$patchDir\*" `
            -DestinationPath $patchZip `
            -CompressionLevel Optimal `
            -Force

          if (-not (Test-Path $patchZip)) {
            throw "Patch ZIP was not created."
          }

          $zipInfo = Get-Item $patchZip

          if ($zipInfo.Length -lt 1024) {
            throw "Patch ZIP is unexpectedly small."
          }

          Write-Host ""
          Write-Host "======================================="
          Write-Host " PATCH READY"
          Write-Host "======================================="
          Write-Host "File: $($zipInfo.FullName)"
          Write-Host "Size: $($zipInfo.Length) bytes"

      - name: Upload lightweight PocketAI patch
        uses: actions/upload-artifact@v6
        with:
          name: PocketAI-win-x64-patch
          path: dist/PocketAI-win-x64-patch.zip
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # FULL RELEASE
      # ============================================================

      - name: Create full release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source  = ".\dist\PocketAI"
          $fullZip = ".\dist\PocketAI-win-x64.zip"

          Remove-Item `
            $fullZip `
            -Force `
            -ErrorAction SilentlyContinue

          if (-not (Test-Path $source)) {
            throw "Publish directory not found: $source"
          }

          Compress-Archive `
            -Path "$source\*" `
            -DestinationPath $fullZip `
            -CompressionLevel Optimal `
            -Force

          if (-not (Test-Path $fullZip)) {
            throw "Full PocketAI archive was not created."
          }

          $info = Get-Item $fullZip

          Write-Host ""
          Write-Host "======================================="
          Write-Host " FULL RELEASE READY"
          Write-Host "======================================="
          Write-Host "File: $($info.FullName)"
          Write-Host "Size: $($info.Length) bytes"

      - name: Upload full PocketAI artifact
        uses: actions/upload-artifact@v6
        with:
          name: PocketAI-win-x64
          path: |
            dist/PocketAI-win-x64.zip
            dist/PocketAI/smoke-test-pocketai.json
            smoke-test-runtime.json
          if-no-files-found: error
          retention-days: 14
