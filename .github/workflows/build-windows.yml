name: Build and smoke-test Pocket AI Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Import original source archive (one-time)
        if: hashFiles('PocketAI-GitHub-Ready.zip') != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'pocketai-source-import'
          Expand-Archive -LiteralPath .\PocketAI-GitHub-Ready.zip -DestinationPath $destination
          $source = Join-Path $destination 'PocketAI-Milestone1'
          Get-ChildItem -LiteralPath $source -Force | Where-Object { $_.Name -ne '.github' } | Copy-Item -Destination $env:GITHUB_WORKSPACE -Recurse -Force
          git rm -- PocketAI-GitHub-Ready.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove source archive' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Import PocketAI source tree from GitHub-ready archive'
          if ($LASTEXITCODE -ne 0) { throw 'Source import commit failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Source import push failed' }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache downloaded AI assets
        uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: pocketai-assets-b10941-qwen3-0.6b-q8

      - name: Fetch verified llama.cpp runtimes and GGUF model
        shell: pwsh
        run: .\scripts\fetch-assets.ps1

      - name: Verify portable layout
        shell: pwsh
        run: .\scripts\verify-layout.ps1 -Strict

      - name: Smoke-test llama.cpp CPU runtime
        shell: pwsh
        run: .\scripts\smoke-test-runtime.ps1

      - name: Restore
        run: dotnet restore .\PocketAI.sln

      - name: Build
        run: dotnet build .\PocketAI.sln -c Release --no-restore

      - name: Publish self-contained win-x64
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1

      - name: Smoke-test actual PocketAI.exe
        shell: pwsh
        run: .\scripts\smoke-test-pocketai.ps1

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\PocketAI\* -DestinationPath .\dist\PocketAI-win-x64.zip -CompressionLevel Optimal

      - name: Upload PocketAI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketAI-win-x64
          path: |
            dist/PocketAI-win-x64.zip
            dist/PocketAI/smoke-test-pocketai.json
            smoke-test-runtime.json
          if-no-files-found: error
          retention-days: 14
